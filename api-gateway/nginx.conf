# ─── Worker Configuration ─────────────────────────────────
worker_processes auto;

events {
  worker_connections 1024;
}

http {

  # ─── Logging Format ─────────────────────────────────────
  log_format main '$remote_addr - $request_method [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ─── Performance ────────────────────────────────────────
  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  # ─── Upstream Services ──────────────────────────────────
  # Docker service names resolve automatically on Docker network

  upstream auth_service {
    server auth-service:3001;
  }

  upstream user_service {
    server user-service:3002;
  }

  upstream job_service {
    server job-service:3003;
  }

  upstream bid_service {
    server bid-service:3004;
  }

  upstream payment_service {
    server payment-service:3005;
  }

  # ─── Server Block ────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # ─── Gateway Health Check ──────────────────────────────
    location /health {
      return 200 '{"status":"healthy","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # ─── Auth Service Routes ───────────────────────────────
    location /api/auth/ {
      proxy_pass http://auth_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # ─── User Service Routes ───────────────────────────────
    location /api/users/ {
      proxy_pass http://user_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # ─── Job Service Routes ────────────────────────────────
    location /api/jobs/ {
      proxy_pass http://job_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # ─── Category Routes — served by job service ───────────
    location /api/categories/ {
      proxy_pass http://job_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # ─── Bid Service Routes ────────────────────────────────
    location /api/bids/ {
      proxy_pass http://bid_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # ─── Payment Service Routes ────────────────────────────
    location /api/payments/ {
      proxy_pass http://payment_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }

    # ─── 404 for unmatched routes ──────────────────────────
    location / {
      return 404 '{"message":"Route not found"}';
      add_header Content-Type application/json;
    }
  }
}
